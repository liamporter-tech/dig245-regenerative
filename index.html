<!doctype html>
<html lang="en">
<head>
    <!-- meta tags, links to css, etc. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <title>PasswordPumpkin</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <!-- visible content goes here -->
<div class="container">
    <div class="row">
        <div class="col-12 text-center mt-5 mb-3">
      
        <h1>
            PasswordPumpkin
        </h1>

    </div>
  </div>
</div>
<div class="container">
  <div class="row mt-5">
    <div class="col-12 flex-column text-center">

      <img src="assets/img/pumpkin.png" class="img-fluid" alt="Picture of jack-o-lantern face">

    </div>
    </div>
</div>
<div class="container">
    <div class="row">
        <div class="col-4 text-center mt-5 mb-3">
      
        

    </div>
  </div>
</div>
<div class="container">
<div class="row mb-5 align-items-center">
    <div class="col-12 text-center">
        <button type="button" id="Generate" class="btn btn-primary col-2">
            Generate Password</button>
    </div>
</div>
</div>

<div class="container">
<div class="row mb-5 align-items-center">
    <div class="col-12 text-center">
        <label for="password">Generated Password:</label>
        <input type="text" id="password" value=" " readonly>
    </div>
</div>
</div>

<div class="container">
<div class="row mb-5">
    <div class="col-12 text-center">
        <label for="strength">Password Strength:</label>
        <input type="text" id="strength" value="" readonly>
    </div>
</div>
</div>


<div class="container">
    <div class="row">
        <div class="col-4 text-center">
           <a href="https://github.com/danielmiessler/SecLists/blob/master/Passwords/Common-Credentials/100k-most-used-passwords-NCSC.txt">
            Click here for more bad passwords
           </a>

        </div>
        <div class="col-4 text-center">
            <p>Disclaimer: These passwords are tricks, not treats. Never use these passwords for any of your accounts. Please.</p>

        </div>
        <div class="col-4 text-center">
           <a href="https://www.eset.com/us/password-generator/">
            Click here to generate a good password
           </a>
        </div>
    </div>
</div>

    <!-- load javascript after the page elements render -->
    <script src="assets/js/main.js"></script>
</body>
</html>
